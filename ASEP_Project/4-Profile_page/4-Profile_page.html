<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->

    <title>Profile Page</title>

<body>
    <section class="vh-100" style="background-color: #f4f5f7;">
        <section class="vh-100" style="background: url('Images/asep1.jpg') no-repeat center center/cover;">
            <div class="container py-5 h-100">
                <div class="row d-flex justify-content-center align-items-center h-100">
                    <div class="col col-lg-6 mb-4 mb-lg-0">
                        <div class="card mb-3" style="border-radius: .5rem; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);">
                            <div class="row g-0">
                                <div class="col-md-4 gradient-custom text-center text-white"

                                    <p>Web Designer</p>
                                    <i class="far fa-edit mb-5"></i>
                                </div>
                                <div class="col-md-8">
                                    <div class="card-body p-4">
                                        <h6>You'r Profile</h6>
                                        <hr class="mt-0 mb-4">
                                        <div class="row pt-1">
                                            <div class="col-6 mb-3">
                                                <h6>Email</h6>
                                                <p class="text-muted">info@example.com</p>
                                            </div>
                                            <div class="col-6 mb-3">
                                                <h6>Phone</h6>
                                                <p class="text-muted">123 456 789</p>
                                            </div>
                                            <div class="col-6 mb-3">
                                                <h6>Company</h6>
                                                <p class="text-muted">Google</p>
                                            </div>
                                            <div class="col-6 mb-3">
                                                <h6>Location</h6>
                                                <p class="text-muted">Pune</p>
                                            </div>
                                            <div class="col-6 mb-3">
                                                <h6>Bio</h6>
                                                <p class="text-muted">I am a jerk!</p>
                                            </div>
                                        </div>
                                        
                                        
                                        
                                        <div class="d-flex justify-content-start">
                                            <a href="#!"><i class="fab fa-facebook-f fa-lg me-3"></i></a>
                                            <a href="#!"><i class="fab fa-twitter fa-lg me-3"></i></a>
                                            <a href="#!"><i class="fab fa-instagram fa-lg"></i></a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
